spec:
  title: "ARO HCP + OpenShift Sandboxed Containers Workshop"
  learning_objectives:
    - "Verify ARO HCP's managed control plane model by inspecting Azure resource groups and HyperShift CRDs"
    - "Scale a NodePool and correlate the Kubernetes-layer action to its Azure consequence"
    - "Deploy OpenShift Sandboxed Containers and configure KataConfig on a kata-dedicated NodePool"
    - "Troubleshoot and resolve common SCC admission failures for kata workloads"
    - "Demonstrate kernel-level isolation by comparing host, runc, and kata pod kernel environments"
    - "Analyze the blast radius of multi-tenant workload compromise under runc versus kata isolation"
  modules:
    - {id: module-00, title: "Introduction and Pre-Flight", duration_min: 10, status: not_started}
    - {id: module-01, title: "Inspect the Cluster Resource Group", duration_min: 10, status: not_started}
    - {id: module-02, title: "Explore HyperShift CRDs — Where Is the Control Plane?", duration_min: 10, status: not_started}
    - {id: module-03, title: "Scale a NodePool", duration_min: 10, status: not_started}
    - {id: module-04, title: "Create a Kata-Dedicated NodePool", duration_min: 10, status: not_started}
    - {id: module-05, title: "Install the Sandboxed Containers Operator", duration_min: 10, status: not_started}
    - {id: module-06, title: "Apply KataConfig and Verify RuntimeClass", duration_min: 10, status: not_started}
    - {id: module-07, title: "SCC + Kata — Trigger, Diagnose, Fix", duration_min: 10, status: not_started}
    - {id: module-08, title: "Untrusted Workload — Kernel Isolation", duration_min: 10, status: not_started}
    - {id: module-09, title: "Multi-Tenant Isolation", duration_min: 10, status: not_started}
    - {id: module-10, title: "Build Pipeline — Host Escape Attempt", duration_min: 10, status: not_started}
    - {id: module-11, title: "Wrap-Up & Questions", duration_min: 10, status: not_started}
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default; ARO HCP requires Azure — infra reviewer must confirm provisioning path
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "5.0"                 # target; GA expected soon — infra reviewer to confirm feasibility; fallback 4.20
    cluster_type: "multinode"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # managed by Red Hat (ARO HCP) — not customer-controlled
    control_plane_cpu: null            # managed by Red Hat (ARO HCP)
    control_plane_ram_gb: null         # managed by Red Hat (ARO HCP)
    worker_count: null                 # TBD — confirmed after Sandboxed Containers testing
    worker_cpu: null                   # TBD — confirmed after testing
    worker_ram_gb: null                # TBD — confirmed after testing
    worker_disk_gb: null               # TBD — confirmed after testing
    # kata-dedicated NodePool: Standard_D4s_v3 (nested virt), count TBD

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # not applicable — AAP not in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products:
      - "Red Hat OpenShift Container Platform 5.0"
    non_ga_access_plan: "GA expected imminently; infra reviewer to confirm OCP 5.0 availability and ARO HCP compatibility. Fallback to OCP 4.20 if 5.0 is not yet available at build time."
    external_services:
      - "management.azure.com"         # Azure CLI resource inspection (modules 1-3)
      - "registry.redhat.io"           # Red Hat operator images (module 5)
      - "registry.access.redhat.com"   # Red Hat container images
      - "quay.io"                      # kata runtime and workload images
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # not applicable
