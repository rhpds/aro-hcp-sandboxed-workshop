# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false  # trust-based, no automated prerequisite checks
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A 120-minute intermediate hands-on lab for Field Engineers, Solution Architects, and Consultants that proves ARO HCP's managed control plane model through Azure CLI inspection and demonstrates OpenShift Sandboxed Containers' kernel-level isolation through live host-escape simulations. Participants progress from confirming the absent control plane in the Azure resource group, through configuring a kata-dedicated NodePool and installing the Sandboxed Containers operator, to executing deliberate cross-tenant secret extraction and host-escape attempts that are absorbed by the guest VM."
    module_summaries:
      - title: "Introduction and Pre-Flight"
        overview: "Instructor frames the two technologies and their customer story connection; participants verify environment readiness by confirming cluster access, node readiness, Azure CLI authentication, and absence of the Sandboxed Containers operator."
      - title: "Inspect the Cluster Resource Group"
        overview: "Participants use the Azure CLI to enumerate resources in the lab resource group, confirming the absence of master VMs, etcd disks, and control plane load balancers; they then inspect Managed Identity Workload Identity bindings that provide credential-free Azure API access for FSI and government compliance."
      - title: "Explore HyperShift CRDs — Where Is the Control Plane?"
        overview: "Participants inspect the HostedCluster CRD and confirm that control plane namespaces contain no etcd or API server pods, establishing that the control plane runs in Red Hat's infrastructure; they examine the NodePool object to understand the operational responsibility boundary and verify that kubeconfig and credential secrets are short-lived and operator-rotated."
      - title: "Scale a NodePool"
        overview: "Participants scale the worker NodePool up and back to baseline using declarative API calls, cross-referencing the Azure CLI before and after to observe the corresponding VM creation and deletion without ever issuing an Azure compute command directly."
      - title: "Create a Kata-Dedicated NodePool"
        overview: "Participants create a second NodePool targeting Standard_D4s_v3 VMs with a kata-specific node label and NoSchedule taint, then verify KVM availability in a node debug shell to confirm nested virtualization support required by the kata runtime."
      - title: "Install the Sandboxed Containers Operator"
        overview: "Participants apply a three-object Subscription manifest and watch the CSV reach Succeeded, using the wait time to explore KataConfig, RuntimeClass, and PeerPodConfig as the operator's three managed resources and evaluate the production implications of Automatic installPlanApproval."
      - title: "Apply KataConfig and Verify RuntimeClass"
        overview: "Participants apply KataConfig with a kataConfigPoolSelector that must exactly match the Module 4 NodePool label, watch the MachineConfigPool update cycle cordon, drain, reboot, and restore nodes, then verify the kata RuntimeClass in the cluster API and the kata handler in containerd's runtime registry on the node."
      - title: "SCC + Kata — Trigger, Diagnose, Fix"
        overview: "Participants deliberately trigger the most common Sandboxed Containers field failure — a Forbidden SCC admission error — then trace it through pod events and oc adm policy who-can, fix it by granting the kata SCC, and evaluate the production tradeoffs of default-SA versus least-privilege service account assignment."
      - title: "Untrusted Workload — Kernel Isolation"
        overview: "Participants deploy runc and kata pods from the same base image and run a three-way kernel version comparison against the host, proving isolation by the differing guest kernel version in the kata pod; /proc visibility inspection reinforces the boundary, closing with a CISO-framed blast radius analysis."
      - title: "Multi-Tenant Isolation"
        overview: "Two kata tenant pods share a physical node, each holding a distinct secret; participants attempt cross-tenant /proc inspection from Tenant A and observe nothing, then repeat the same inspection with runc tenants where Tenant B's secrets are visible, making the difference between soft and hard multi-tenancy concrete through side-by-side output."
      - title: "Build Pipeline — Host Escape Attempt"
        overview: "Participants deploy a privileged build pod under the kata runtime and execute two host-escape attempts — a sysrq reboot trigger and a kernel module load — both of which are absorbed by the guest VM; post-attempt node health checks confirm zero impact, reframing the field conversation around blast radius rather than prevention."
      - title: "Wrap-Up & Questions"
        overview: "The closing module synthesizes the 110-minute terminal session into a customer-conversation frame, recapping the ARO HCP cost and compliance proof points, the Sandboxed Containers isolation guarantees demonstrated, and the open production questions participants can bring directly to their next customer engagement."
    rcars_overlap_pct: 76
    rcars_top_matches:
      - title: "Understanding Confidential Containers - Workshop on ARO"
        ci_name: "azure-gpte.ocp4-sandbox-workshop-on-aro.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=azure-gpte.ocp4-sandbox-workshop-on-aro.prod"
        relevance_score: 76
        why_it_fits: "Runs on ARO and uses the OpenShift Sandboxed Containers operator with Kata Containers (kata-remote runtime class), covering KataConfig CRD configuration."
        workloads: []
      - title: "Experience OpenShift Virtualization with Azure Red Hat OpenShift"
        ci_name: "azure-gpte.aro-virt-roadshow.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=azure-gpte.aro-virt-roadshow.prod"
        relevance_score: 49
        why_it_fits: "Shares the ARO platform context but focuses on VM management and VMware migration."
        workloads: []
      - title: "Using Hosted Control Planes for OpenShift on OpenShift"
        ci_name: "openshift-cnv.hcp-ocp-virt-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.hcp-ocp-virt-cnv.prod"
        relevance_score: 37
        why_it_fits: "Covers Hosted Control Planes and NodePool scaling, but targets HCP on OpenShift Virtualization (KubeVirt) rather than ARO HCP on Azure."
        workloads: []
    catalog_gap: "No existing catalog item combines ARO HCP's managed control plane model with OpenShift Sandboxed Containers isolation verification in a 120-minute field format. The closest match (CoCo Workshop on ARO) covers OSC operator mechanics but is a 4-hour attestation deep-dive. This design uniquely pairs Azure CLI-based control plane inspection (Modules 1-3) with kernel isolation proof and host-escape simulation (Modules 8-10)."
